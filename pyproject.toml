[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-viewer"
version = "0.1.0"
description = "Cross-platform PS4 PKG inspection and validation tool"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
pkg-viewer = "pkgviewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_pkg: tests requiring local real PS4 PKG samples"]

[tool.ruff]
line-length = 100
