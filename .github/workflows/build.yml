name: Build packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            script: bash build_macos.sh
          - os: windows-2022
            script: powershell -ExecutionPolicy Bypass -File build_windows.ps1
          - os: ubuntu-22.04
            script: bash build_linux.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: pkgviewer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
            dist/*.app
